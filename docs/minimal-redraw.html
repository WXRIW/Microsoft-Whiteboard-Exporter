<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>SceneDocument v1 最小离线重绘</title><style>
body{margin:0;font:14px "Segoe UI","Microsoft YaHei",sans-serif;background:#f3f6fb;color:#24334b}header{padding:18px 24px;background:white;border-bottom:1px solid #dce3ed;display:flex;flex-wrap:wrap;gap:14px;align-items:center}h1{font-size:19px;margin:0}label{padding:8px 12px;border:1px solid #dce3ed;border-radius:6px}main{padding:24px}#status{margin-bottom:12px;color:#64748b}#canvas{width:100%;min-height:500px;background:white;box-shadow:0 5px 25px #0001}input{max-width:250px}
</style></head><body><header><h1>公开 JSON 独立重绘</h1><label>① 选择 scene.json <input id="scene" type="file" accept=".json"></label><label>② 选择配套资源目录 <input id="assets" type="file" webkitdirectory multiple></label></header><main><div id="status">打开 samples/demo-scene.json，再选择 samples 目录。所有读取均在本机完成。</div><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></main><script>
'use strict';
const SVG_NS='http://www.w3.org/2000/svg', HTML_NS='http://www.w3.org/1999/xhtml';
const canvas=document.getElementById('canvas'),status=document.getElementById('status');
const assets=new Map(),objectUrls=[];let scene=null;
document.getElementById('scene').onchange=async event=>{try{scene=JSON.parse(await event.target.files[0].text());draw();}catch(error){status.textContent=error.message;}};
document.getElementById('assets').onchange=event=>{for(const url of objectUrls)URL.revokeObjectURL(url);objectUrls.length=0;assets.clear();for(const file of event.target.files){const relative=file.webkitRelativePath.split('/').slice(1).join('/');const url=URL.createObjectURL(file);objectUrls.push(url);assets.set(relative,url);}if(scene)draw();};
function node(name,attributes={},namespace=SVG_NS){const el=document.createElementNS(namespace,name);for(const [key,value]of Object.entries(attributes))el.setAttribute(key,String(value));return el;}
function imageUrl(id){const meta=scene.assets?.[id];return meta&&!meta.invalid ? assets.get(meta.path)||(/^data:image\/(png|jpeg|gif|webp|svg\+xml|bmp);base64,/i.test(meta.dataUrl||'')?meta.dataUrl:'')||'' : '';}
const svgTags=new Set('svg g path rect circle ellipse line polyline polygon text tspan defs linearGradient radialGradient stop clipPath mask use image marker'.toLowerCase().split(' '));
const htmlTags=new Set('div span p br strong b em i u pre code blockquote ol ul li table thead tbody tr th td h1 h2 h3 a img'.split(' '));
const attrs=new Set('id x y x1 y1 x2 y2 cx cy r rx ry width height d points viewbox preserveaspectratio transform fill fill-opacity fill-rule stroke stroke-width stroke-opacity stroke-linecap stroke-linejoin opacity xmlns gradientunits gradienttransform offset stop-color stop-opacity clippathunits markerwidth markerheight refx refy orient marker-start marker-end colspan rowspan alt'.split(' '));
function clean(source){if(source.nodeType===3)return document.createTextNode(source.textContent);if(source.nodeType!==1)return null;const name=source.localName.toLowerCase(),isSvg=source.namespaceURI===SVG_NS;if(!(isSvg?svgTags:htmlTags).has(name))return null;const el=document.createElementNS(isSvg?SVG_NS:HTML_NS,source.localName);for(const attr of source.attributes){const key=attr.name.toLowerCase(),value=attr.value;if(key==='style'){const css=document.createElement('span').style;css.cssText=value;const safe=[];for(const prop of css){const val=css.getPropertyValue(prop);if(!/url\(|expression|javascript:|\\|@import|behavior/i.test(val)&&/^(?:display|position|left|top|width|height|font(?:-.+)?|line-height|color|background(?:-color)?|border(?:-.+)?|padding(?:-.+)?|margin(?:-.+)?|text-.+|white-space|overflow(?:-.+)?|box-sizing|opacity|transform(?:-origin)?|object-fit|fill|stroke(?:-.+)?|list-.+|table-.+)$/.test(prop))safe.push(prop+':'+val);}el.setAttribute('style',safe.join(';'));}else if((key==='src'||key==='href'||key==='xlink:href')&&name!=='a'){const asset=value.startsWith('wbasset:')?imageUrl(value.slice(8)):'';if(asset)el.setAttribute(isSvg?'href':'src',asset);else if(value.startsWith('#'))el.setAttribute('href',value);}else if(attrs.has(key)&&!/javascript:|url\(\s*["']?(?!#)/i.test(value))el.setAttribute(attr.name,value);}for(const child of source.childNodes){const safe=clean(child);if(safe)el.appendChild(safe);}return el;}
function appendMarkup(parent,markup,isSvg){const doc=new DOMParser().parseFromString(isSvg?'<svg xmlns="'+SVG_NS+'">'+markup+'</svg>':markup,isSvg?'image/svg+xml':'text/html');if(doc.querySelector('parsererror'))return;const root=isSvg?doc.documentElement:doc.body;for(const source of root.childNodes){const safe=clean(source);if(safe)parent.appendChild(safe);}}
function element(source){const matrix=source.transform||[1,0,0,1,0,0];if(matrix.length!==6||matrix.some(n=>!Number.isFinite(n)))throw Error('元素变换无效');const group=node('g',{transform:'matrix('+matrix.join(' ')+')',opacity:Math.max(0,Math.min(1,source.style?.opacity??1))});const b=source.bounds||{x:0,y:0,width:250,height:100};if(source.svg)appendMarkup(group,source.svg,true);else if(source.html){const foreign=node('foreignObject',{x:b.x,y:b.y,width:Math.max(1,b.width),height:Math.max(1,b.height)}),wrapper=node('div',{style:'width:100%;height:100%;overflow:visible'},HTML_NS);appendMarkup(wrapper,source.html,false);foreign.appendChild(wrapper);group.appendChild(foreign);}else if(source.assetId){const url=imageUrl(source.assetId);if(url)group.appendChild(node('image',{x:b.x,y:b.y,width:b.width,height:b.height,href:url}));else{group.appendChild(node('rect',{x:b.x,y:b.y,width:b.width,height:b.height,fill:'#edf2f7',stroke:'#94a3b8'}));const text=node('text',{x:b.x+12,y:b.y+28,fill:'#64748b'});text.textContent='缺失图片 '+source.assetId;group.appendChild(text);}}else if(source.text){const text=node('text',{x:b.x,y:b.y+25,fill:'#24334b','font-size':24});text.textContent=source.text;group.appendChild(text);}for(const child of [...(source.children||[])].sort((a,b)=>(a.z||0)-(b.z||0)))group.appendChild(element(child));return group;}
function draw(){if(scene?.schemaVersion!==1||!scene.bounds||!Array.isArray(scene.elements))throw Error('需要 SceneDocument v1');const b=scene.bounds;if([b.x,b.y,b.width,b.height].some(n=>!Number.isFinite(n))||b.width<=0||b.height<=0)throw Error('画布边界无效');canvas.replaceChildren();canvas.setAttribute('viewBox',[b.x,b.y,b.width,b.height].join(' '));canvas.setAttribute('style','aspect-ratio:'+b.width+'/'+b.height);canvas.appendChild(node('rect',{x:b.x,y:b.y,width:b.width,height:b.height,fill:/^(#[0-9a-f]{3,8}|white)$/i.test(scene.background||'')?scene.background:'#ffffff'}));for(const item of [...scene.elements].sort((a,b)=>(a.z||0)-(b.z||0)))canvas.appendChild(element(item));const missing=Object.entries(scene.assets||{}).filter(([id])=>!imageUrl(id)).length;status.textContent=(scene.board?.title||'白板')+' · '+scene.elements.length+' 个顶层对象 · '+(missing?'缺失 '+missing+' 个资源，请选择配套目录':'全部资源已就绪');}
</script></body></html>
